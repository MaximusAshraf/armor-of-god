<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Guide</title>
<link rel="stylesheet" href="../public/style.css">
<style>
  html, body { margin: 0; }
  body { width: 2000px; user-select: auto; }
  body::before { position: absolute; }
  .g { padding: 56px 64px 60px; }
  .g h1 { font-size: 68px; margin: 0; } .g .sub { font-size: 32px; margin: 8px 0 28px; }
  .hd { display: flex; align-items: center; gap: 24px; }
  h2.sec { font-size: 38px; margin: 26px 0 16px; opacity: .9; }
  .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .chip2 { background: #ffffff10; border-radius: 22px; padding: 22px 26px; display: flex; gap: 18px; align-items: center; font-size: 29px; line-height: 1.35; }
  .num { flex: none; width: 54px; height: 54px; border-radius: 50%; background: #2563eb; display: grid; place-items: center; font-weight: 900; font-size: 30px; }
  .num.green { background: #16a34a; width: 64px; height: 64px; font-size: 36px; }
  .row { display: flex; justify-content: space-between; margin-top: 18px; }
  .col { width: 300px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .col .cap { font-size: 26px; font-weight: 800; line-height: 1.35; }
  .ph { width: 300px; height: 548px; border-radius: 40px; border: 6px solid #2a3350; background: #0b0f25; overflow: hidden; position: relative; box-shadow: 0 20px 40px #0009; }
  .phin { width: 375px; height: 685px; zoom: .8; position: relative; overflow: hidden; text-align: start; }
  .phin .top { position: static; } .phin .ov { position: absolute; } .phin .rays { width: 900px; height: 900px; margin: -450px; }
  .phin #stage, .phin .stg { padding: 6px 14px 20px; } .phin .viewfinder { width: 320px; }
  .scene { position: absolute; inset: 0; background: linear-gradient(160deg, #3a3329, #1c1a22 60%, #2c2530); }
  .scene .wall-qr { position: absolute; width: 78px; background: #fff; padding: 3px; border-radius: 4px; left: 7%; top: 7%; transform: rotate(-6deg); box-shadow: 0 6px 14px #000a; } .scene .wall-qr svg { width: 100%; height: auto; display: block; }
  .scene .shape { position: absolute; border-radius: 12px; background: #ffffff0d; }
  .strips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 26px; }
  .strip { background: #ffffff10; border-radius: 22px; padding: 16px 20px; } .strip h3 { margin: 0 0 8px; font-size: 28px; }
  .strip .icons { display: flex; gap: 10px; } .strip .icons > div { flex: 1; min-width: 0; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; margin-top: 30px; }
  .cd { background: #ffffff0d; border-radius: 28px; padding: 28px 32px 30px; border-top: 14px solid var(--c); font-size: 29px; line-height: 1.5; }
  .cd h3 { margin: 0 0 12px; font-size: 40px; } .cd ul { margin: 0; padding-inline-start: 28px; } .cd li { margin-bottom: 10px; }
  /* admin guide */
  .box { background: #ffffff0d; border-radius: 30px; padding: 30px 34px; margin-top: 26px; }
  .box h2 { margin: 0 0 18px; font-size: 46px; display: flex; align-items: center; gap: 18px; }
  .two { display: flex; gap: 32px; align-items: center; } .two > * { flex: 1; min-width: 0; }
  .shot { border-radius: 18px; border: 3px solid #2a3350; width: 100%; display: block; box-shadow: 0 14px 30px #0008; }
  .box ul { margin: 0; padding-inline-start: 30px; font-size: 30px; line-height: 1.55; } .box li { margin-bottom: 12px; }
  code, .mono { font-family: Menlo, Consolas, monospace; direction: ltr; unicode-bidi: embed; background: #00000055; padding: 2px 10px; border-radius: 10px; font-size: .9em; }
  .four { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; } .four .cd { border-top-width: 10px; text-align: center; } .four .cd h3 { font-size: 36px; }
  .tips { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 22px; } .tip { background: #ffffff14; border-radius: 999px; padding: 14px 26px; font-size: 28px; }
</style>
</head>
<body>
<div class="g" id="root"></div>
<script src="qr.js"></script>
<script src="../public/common.js"></script>
<script>
const Q = new URLSearchParams(location.search), DOC = Q.get('doc') || 'player';
const AR = LANG === 'ar';
const T = (ar, en) => (AR ? ar : en);
const root = document.getElementById('root');
const team = '#3b82f6';

// ---------- phone mock-ups built from the real game components ----------
function armorStrip(found, defeated, current) {
  return `<div class="armor">${CFG_TOOLS.map((_, i) => `<div class="slot ${i < found ? 'found' : ''} ${i < defeated ? 'defeated' : ''} ${i === current ? 'current' : ''}">${Art.tool(i)}</div>`).join('')}</div>`;
}
const CFG_TOOLS = [0, 1, 2, 3, 4, 5];
const topBar = () => `<div class="top"><div class="chip"><i></i><span>${T('الفريق الأزرق', 'Blue Team')}</span></div><button class="btn ghost">🔊</button><button class="btn ghost">ع / EN</button></div>`;
const scene = (withQr) => `<div class="scene"><div class="shape" style="left:8%;top:10%;width:30%;height:26%"></div><div class="shape" style="right:6%;bottom:12%;width:36%;height:30%"></div>${withQr ? `<div class="wall-qr">${window.QR_SAMPLE}</div>` : ''}</div>`;
const finder = (inner, qr = true) => `<div class="viewfinder">${scene(qr)}<div class="frame"></div><div class="scanline"></div>${inner}</div>`;
const phone = (inner) => `<div class="ph"><div class="phin" style="--team:${team}">${topBar()}${inner}</div></div>`;
const col = (n, ph, cap) => `<div class="col"><div class="num green">${n}</div>${ph}<div class="cap">${cap}</div></div>`;
const itemLayer = (kind, idx, name, label, lvl) => `<div class="item-layer"><div class="item"><div class="item-art">${Art[kind](idx)}</div>${lvl ? `<div class="lvl">${T('المستوى', 'Level')} ${lvl}</div>` : ''}<div class="item-name">${name}</div><div class="item-tap">👆 ${label}</div></div></div>`;

const nameOf = (a, b) => T(a, b);
const tools = [['منطقة الحق', 'Belt of Truth'], ['درع البر', 'Breastplate of Righteousness'], ['حذاء الإنجيل', 'Shoes of Peace'], ['ترس الإيمان', 'Shield of Faith'], ['خوذة الخلاص', 'Helmet of Salvation'], ['سيف الروح', 'Sword of the Spirit']];
const monsters = [['وحش الكذب', 'The Liar'], ['وحش الاتهام', 'The Accuser'], ['الخوف والانقسام', 'Fear Phantom'], ['وحش الشك', 'Doubt Cyclops'], ['وحش اليأس', 'Storm of Despair'], ['التنين العظيم', 'Great Dragon']];

function playerGuide() {
  const p1 = phone(`${armorStrip(0, 0, 0)}<div class="stg center"><div class="sm">${T('ابحثوا عن QR الأداة', 'Find the QR of the tool')}</div><div class="title-md">${T(tools[0][0], tools[0][1])}</div>${finder('')}<div class="hint">📷 ${T('وجّهوا الكاميرا نحو كود QR مخفي', 'Point the camera at a hidden QR code')}</div></div>`);
  const p2 = phone(`${armorStrip(0, 0, 0)}<div class="stg center"><div class="sm">${T('ابحثوا عن QR الأداة', 'Find the QR of the tool')}</div><div class="title-md">${T(tools[0][0], tools[0][1])}</div>${finder(itemLayer('tool', 0, T(tools[0][0], tools[0][1]), T('اضغط لتأخذ الأداة', 'Tap to collect the tool')))}<div class="hint">👆 ${T('يظهر شيء شفاف — اضغطوا عليه', 'A see-through item appears — tap it')}</div></div>`);
  const p3 = phone(`${armorStrip(1, 0, 0)}<div class="ov" style="top:60px"><div class="rays"></div><div class="inner" style="padding-top:20px"><div class="title-md" style="color:var(--gold)">✨ ${T('وجدتم الأداة!', 'Tool found!')} ✨</div><div class="fly" style="animation:none;width:170px">${Art.tool(0)}</div><div class="title-md">${T(tools[0][0], tools[0][1])}</div><div class="verse" style="font-size:.95rem">${T('فَاثْبُتُوا مُمَنْطِقِينَ أَحْقَاءَكُمْ بِالْحَقِّ', 'Stand therefore, having your loins girt about with truth')}<b>${T('أفسس ٦: ١٤', 'Ephesians 6:14')}</b></div><p class="title-md" style="color:#ff9a9a;font-size:1.1rem">⚠️ ${T('والآن ابحثوا عن QR الوحش!', 'Now find the monster’s QR!')}</p></div></div>`);
  const p4 = phone(`${armorStrip(1, 0, 0)}<div class="stg center"><div class="sm">${T('ابحثوا عن QR الوحش', 'Find the QR of the monster')}</div><div class="title-md">${T(monsters[0][0], monsters[0][1])}</div><div class="gather">👥 <b>${T('التجمّع عند الوحش', 'Gather at the monster')}</b>: ${T('2 من 4 حاضرون', '2 of 4 are here')}<div class="sm">${T('كل واحد يمسح كود الوحش ويضغط عليه', 'Everyone scans the monster QR and taps it')}</div></div>${finder(itemLayer('monster', 0, T(monsters[0][0], monsters[0][1]), T('اضغط لاستدعاء الوحش', 'Tap to summon the monster')))}</div>`);
  const p5 = phone(`${armorStrip(1, 0, 0)}<div class="stg center"><div class="title-md">${T(monsters[0][0], monsters[0][1])}</div><div class="monsterbox" style="width:230px">${Art.monster(0)}</div><div class="hpbar"><div style="width:62%"></div></div><div class="quorum"><i class="on">⚔️</i><i class="on">⚔️</i><i></i></div><div class="status good">${T('ممتاز! استمروا! (2/3)', 'Great! Keep going! (2/3)')}</div><div class="tapme">👆 ${T('اضغطوا بسرعة — كلكم معًا!', 'Tap fast — all together!')}</div></div>`);
  const p6 = phone(`${armorStrip(0, 0, 0)}<div class="ov" style="top:60px"><div class="rays" style="filter:hue-rotate(-70deg) saturate(1.5)"></div><div class="inner" style="padding-top:20px"><div class="title-md" style="color:#ff8b8b">☠️ ${T('وقعتم في فخ!', 'You fell into a trap!')}</div><div style="width:110px;margin:6px auto">${Art.trap(0)}</div><div class="sm">${T('عملة ذهبية — محبة المال أصل كل شر', 'Golden Coin — love of money is a root of all evil')}</div><div class="title-md" style="font-size:1.1rem;margin-top:8px">${T('خسرتم: منطقة الحق', 'You lost: Belt of Truth')}</div><div style="width:100px;margin:4px auto;filter:grayscale(1) brightness(.7)">${Art.tool(0)}</div><p style="font-size:.9rem;line-height:1.6">${T('ارجعوا وخذوها من جديد — لا حاجة لهزيمة الوحش مرة أخرى', 'Go back and take it again — no need to beat the monster again')}</p></div></div>`);

  const strip = (title, n, fn, names) => `<div class="strip"><h3>${title}</h3><div class="icons">${[0, 1, 2, 3, 4, 5].map((i) => `<div>${fn(i)}</div>`).join('')}</div></div>`;
  root.innerHTML = `
    <div class="hd"><div style="width:96px">${Art.tool(5)}</div><div><h1>${T('سلاح الله الكامل — طريقة اللعب', 'The Whole Weapon of God — How to play')}</h1>
      <div class="sub">${T('اجمعوا القطع الست واهزموا الوحوش الست… كفريق واحد (أفسس ٦: ١٠–١٨)', 'Collect the 6 pieces and beat the 6 monsters — as one team (Ephesians 6:10–18)')}</div></div></div>
    <h2 class="sec">${T('قبل اللعب', 'Before you play')}</h2>
    <div class="chips">
      <div class="chip2"><span class="num">1</span>${T('اتصل بالواي فاي الخاص باللعبة', 'Connect to the game Wi-Fi')}</div>
      <div class="chip2"><span class="num">2</span>${T('امسح QR الانضمام (واقبل تحذير الشهادة مرة واحدة: «متقدم» ← «متابعة»)', 'Scan the join QR (accept the certificate warning once: “Advanced” → “Continue”)')}</div>
      <div class="chip2"><span class="num">3</span>${T('اكتب اسمك — يوزّعك النظام على فريق تلقائيًا', 'Type your name — you are placed in a team automatically')}</div>
      <div class="chip2"><span class="num">4</span>${T('اسمح باستخدام الكاميرا وانتظر بدء المشرف', 'Allow the camera and wait for the admin to start')}</div>
    </div>
    <div class="row">${col(1, p1, T('ابحثوا عن QR الأداة المخفي ووجّهوا الكاميرا إليه', 'Hunt for the hidden tool QR and point the camera at it'))}
      ${col(2, p2, T('يظهر العنصر شفافًا فوق الكاميرا — اضغطوا عليه لتأخذوه', 'The item appears see-through over the camera — tap it to take it'))}
      ${col(3, p3, T('وجدتم الأداة! ثم ابحثوا عن QR الوحش الذي يحرسها', 'Tool found! Now hunt the QR of the monster guarding it'))}
      ${col(4, p4, T('تجمّعوا عند الوحش: كل واحد يمسح ويضغط حتى تكتمل النسبة', 'Gather at the monster: everyone scans and taps until enough are here'))}
      ${col(5, p5, T('القتال: اضغطوا بسرعة معًا — القليل من اللاعبين لا يؤذي الوحش', 'Fight: tap fast together — too few tappers do not hurt it'))}
      ${col(6, p6, T('احذروا الفخاخ! ضغطة على عنصر مغرٍ تُضيّع آخر أداة', 'Beware of traps! Tapping a tempting item loses your last tool'))}</div>
    <div class="strips">
      ${strip(T('٦ أدوات (بالترتيب)', '6 tools (in order)'), 6, (i) => Art.tool(i))}
      ${strip(T('٦ وحوش (بالترتيب)', '6 monsters (in order)'), 6, (i) => Art.monster(i))}
      ${strip(T('٦ فخاخ مغرية ⚠️', '6 tempting traps ⚠️'), 6, (i) => Art.trap(i))}
    </div>
    <div class="cards">
      <div class="cd" style="--c:#22c55e"><h3>⭐ ${T('كيف تفوزون', 'How to win')}</h3><ul>
        <li>${T('خذوا الأداة 1 ثم اهزموا الوحش 1 ثم الأداة 2… حتى الأخيرة', 'Take tool 1, beat monster 1, then tool 2 … up to the last one')}</li>
        <li>${T('الفريق الذي يكمل القطع الست أولًا يفوز', 'The first team to finish all six wins')}</li></ul></div>
      <div class="cd" style="--c:#ef4444"><h3>⚠️ ${T('انتبهوا', 'Be careful')}</h3><ul>
        <li>${T('عنصر خارج الترتيب يظهر لكن عليه شارة «المستوى N» — لن يفيدكم الآن', 'An out-of-order item still appears with a “Level N” badge — it will not work yet')}</li>
        <li>${T('عنصر بلا مستوى وليس ما تبحثون عنه؟ قد يكون فخًّا', 'No level badge and not what you hunt? It may be a trap')}</li>
        <li>${T('الفخ يأخذ آخر أداة فقط — امسحوها وخذوها ثانية دون قتال', 'A trap takes only your last tool — scan and take it again, no fight needed')}</li></ul></div>
      <div class="cd" style="--c:#f59e0b"><h3>🏆 ${T('النهاية', 'The end')}</h3><ul>
        <li>${T('الشاشة الكبرى تعرض تقدّم كل الفرق والترتيب مباشرة', 'The big screen shows every team’s progress and the ranking live')}</li>
        <li>${T('اللعب جماعي: عند الوحش لا بد أن يضغط عدد كافٍ من فريقكم معًا', 'It is teamwork: enough teammates must tap together at the monster')}</li></ul></div>
    </div>`;
}

function adminGuide() {
  const S = (n) => `shots/${n}-${LANG}.png`;
  root.innerHTML = `
    <div class="hd"><div style="width:96px">${Art.tool(3)}</div><div><h1>${T('سلاح الله الكامل — دليل المشرف', 'The Whole Weapon of God — Admin guide')}</h1>
      <div class="sub">${T('شغّل اللعبة من اللابتوب: فرق، أكواد QR، شاشة عرض وتحكم كامل', 'Run the game from the laptop: teams, QR codes, big screen and full control')}</div></div></div>

    <div class="box"><h2><span class="num green">1</span>${T('شغّل السيرفر وجهّز الأكواد', 'Start the server and prepare the codes')}</h2>
      <div class="two"><ul>
        <li>${T('في المجلد:', 'In the project folder:')} <code>npm start</code> — ${T('اللاعبون يدخلون من', 'players join at')} <code>https://IP:4000</code></li>
        <li>${T('افتح', 'Open')} <code>https://localhost:4000/qrs</code> ${T('واطبع: ١٨ صفحة A4، على كل صفحة QR كبير', 'and print: 18 A4 pages, one big QR each')}</li>
        <li>${T('٦ أدوات + ٦ وحوش + ٦ فخاخ — اخفوها في أماكن مختلفة (كل الفرق تبحث عن نفس الأكواد)', '6 tools + 6 monsters + 6 traps — hide them around (all teams hunt the same codes)')}</li>
        <li>${T('بلا طابعة؟ افتح', 'No printer? Open')} <code>/demo</code> ${T('لعرض الأكواد مبعثرة عشوائيًا على الشاشة للتجربة', 'to show the codes scattered at random on screen for a test')}</li></ul>
        <div style="display:flex;gap:20px;align-items:flex-start"><img class="shot" style="width:36%" src="shots/print.png"><img class="shot" style="width:64%" src="shots/demo-ar.png"></div></div></div>

    <div class="box"><h2><span class="num green">2</span>${T('لوحة المشرف', 'The admin board')} <span class="mono" style="font-size:26px">https://localhost:4000/admin</span></h2>
      <div class="two"><img class="shot" src="${S('admin')}"><ul>
        <li><b>${T('عدد الفرق', 'Number of teams')}</b> — ${T('٢ افتراضيًا. قبل البدء أي عدد حتى ٨ ويُعاد توزيع اللاعبين؛ أثناء اللعب يمكن الزيادة فقط', '2 by default. Before the start any number up to 8 and players are re-balanced; while running you can only add')}</li>
        <li><b>${T('نسبة التجمّع', 'Gather %')}</b> — ${T('كم % من الفريق المتصل يجب أن يمسح كود الوحش ويضغط عليه قبل القتال (٠ = بلا شرط)', 'what % of the online team must scan and tap the monster before the fight (0 = no condition)')}</li>
        <li>${T('ابدأ المعركة / إعادة. الجدول يعرض تقدّم كل فريق وصحة الوحش', 'Start / Reset. The table shows each team’s progress and the monster’s health')}</li>
        <li><b>${T('اللاعبون', 'Players')}</b>: ${T('أخضر = متصل، رمادي = غير متصل، مع صورة صغيرة ورقم مستواهم', 'green = online, grey = offline, with a small picture and their level')}</li>
        <li><b>⏭ ${T('تخطي', 'Skip')}</b> ${T('لكل فريق ولكل لاعب: يأخذ الأداة / يسجّل حضوره عند الوحش / يهزمه', 'per team and per player: takes the tool / registers at the monster / beats it')}</li></ul></div></div>

    <div class="box"><h2><span class="num green">3</span>${T('شاشة العرض (البروجكتر)', 'The big screen (projector)')} <span class="mono" style="font-size:26px">https://localhost:4000/screen</span></h2>
      <div class="two"><ul>
        <li>${T('تعرض كل فريق: القطع التي يملكها (✓ للوحوش المهزومة) وما يبحث عنه الآن', 'Shows each team: the pieces it owns (✓ for beaten monsters) and what it hunts now')}</li>
        <li>${T('أثناء القتال: صحة الوحش وعدد الضاغطين الآن', 'During a fight: the monster’s health and how many are tapping')}</li>
        <li>${T('في الأعلى: الوقت و QR الانضمام. وفي الأسفل شريط الأحداث المباشر', 'On top: the clock and the join QR. Below: a live event ticker')}</li>
        <li>${T('الترتيب بالميداليات 🥇🥈🥉', 'Ranking with medals 🥇🥈🥉')}</li></ul><img class="shot" src="${S('screen')}"></div></div>

    <div class="box"><h2><span class="num green">4</span>${T('أثناء اللعب وبين المجموعات', 'During the game and between groups')}</h2>
      <div class="four">
        <div class="cd" style="--c:#3b82f6"><h3>▶ ${T('ابدأ', 'Start')}</h3>${T('بعد انضمام الجميع اضغط «ابدأ المعركة» فيبدأ الوقت', 'When everyone joined press “Start the battle” — the clock starts')}</div>
        <div class="cd" style="--c:#f59e0b"><h3>⏭ ${T('ساعد', 'Help')}</h3>${T('إن علق فريق أو لاعب اضغط تخطي له', 'If a team or player is stuck press Skip for them')}</div>
        <div class="cd" style="--c:#22c55e"><h3>🏆 ${T('الفائز', 'Winner')}</h3>${T('أول فريق يكمل ٦ أدوات يفوز ويظهر وقته', 'The first team with all 6 wins and its time is shown')}</div>
        <div class="cd" style="--c:#ef4444"><h3>↺ ${T('إعادة', 'Reset')}</h3>${T('تصفّر التقدم وتبقي اللاعبين لمجموعة جديدة', 'Clears progress and keeps the players for a new round')}</div></div>
      <div class="tips"><span class="tip">💡 ${T('اللابتوب بكابل على الراوتر', 'Laptop on a cable to the router')}</span><span class="tip">📷 ${T('اطلب من اللاعبين السماح بالكاميرا', 'Ask players to allow the camera')}</span><span class="tip">🔒 ${T('تحذير الشهادة يظهر مرة واحدة لكل هاتف', 'The certificate warning shows once per phone')}</span><span class="tip">🖨 ${T('ابقَ الصفحات المطبوعة بحجم A4 كاملًا للمسح من بعيد', 'Keep the printouts full-page A4 so they scan from afar')}</span></div></div>`;
}
(DOC === 'admin' ? adminGuide : playerGuide)();
addEventListener('load', () => setTimeout(() => { document.body.dataset.h = Math.ceil(root.getBoundingClientRect().height); }, 400));
